<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pertanyaan Penting Banget</title>
  <!-- Library Confetti untuk efek letupan mercon -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd1dc, #ffecd2);
      overflow: hidden;
      padding: 16px;
    }

    /* Box Pertanyaan Utama */
    .card {
      background: #ffffff;
      padding: 24px 18px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 290px;
      width: 100%;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: left 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  top 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  opacity 0.4s ease, 
                  transform 0.4s ease;
      z-index: 10;
    }

    /* Kelas animasi memudar saat tombol Yes diklik */
    .card.fade-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.7);
      pointer-events: none;
    }

    h1 {
      font-size: 1.15rem;
      color: #333333;
      margin-bottom: 20px;
      line-height: 1.35;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    button {
      padding: 9px 15px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
      white-space: nowrap;
      user-select: none;
    }

    #btn-yes {
      background-color: #ff4d6d;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.35);
    }

    #btn-yes:hover {
      transform: scale(1.08);
      background-color: #e03657;
    }

    #btn-no {
      background-color: #adb5bd;
      color: #ffffff;
    }

    /* Container Hasil (Tanpa Box / Polos di atas Background) */
    #result-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 99;
      padding: 16px;
      max-width: 90vw;
    }

    /* Foto Raw berputar 4 kali (1440 deg) */
    .raw-rotating-img {
      max-width: 260px;
      max-height: 260px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 18px;
      animation: spinFourTimes 2.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes spinFourTimes {
      0% {
        transform: scale(0.2) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(1440deg); /* 360 x 4 putaran */
        opacity: 1;
      }
    }

    /* Tulisan di bawah foto tanpa box */
    .result-text {
      color: #ff2a55;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.4;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.8);
      animation: fadeInText 1s ease 0.6s forwards;
      opacity: 0;
    }

    @keyframes fadeInText {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Box Pertanyaan Utama -->
  <div class="card" id="main-card">
    <div id="question-box">
      <h1>kamu sayang aku gak??</h1>
      <div class="btn-container">
        <button id="btn-yes">BANGET!!!!</button>
        <button id="btn-no">eewhh enggak!</button>
      </div>
    </div>
  </div>

  <!-- Tampilan Hasil Tanpa Box -->
  <div id="result-view">
    <!-- SLOT GAMBAR: Ganti URL atau nama file fotomu di sini -->
    <img 
      src="foto.jpeg" 
      alt="Foto Spesial" 
      class="raw-rotating-img" 
      id="target-img"
    />
    <p class="result-text">yeeyy aku juga sayang banget sama kamu 🥰❤️🎉</p>
  </div>

  <script>
    const mainCard = document.getElementById('main-card');
    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const resultView = document.getElementById('result-view');

    // Seluruh card menghindar saat cursor atau sentuhan mendekati tombol no
    function kaburCard() {
      const padding = 20;
      const cardWidth = mainCard.offsetWidth;
      const cardHeight = mainCard.offsetHeight;

      const batasKanan = window.innerWidth - cardWidth - padding;
      const batasBawah = window.innerHeight - cardHeight - padding;

      const randomX = Math.max(padding, Math.random() * batasKanan);
      const randomY = Math.max(padding, Math.random() * batasBawah);

      mainCard.style.transform = 'none';
      mainCard.style.left = `${randomX}px`;
      mainCard.style.top = `${randomY}px`;
    }

    btnNo.addEventListener('mouseenter', kaburCard);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      kaburCard();
    });

    // Animasi mercon
    function luncurkanMercon() {
      const durasi = 3 * 1000;
      const animasiSelesai = Date.now() + durasi;

      const interval = setInterval(function() {
        const sisaWaktu = animasiSelesai - Date.now();
        if (sisaWaktu <= 0) {
          return clearInterval(interval);
        }

        confetti({
          startVelocity: 35,
          spread: 360,
          ticks: 60,
          origin: { x: Math.random() * 0.4 + 0.1, y: Math.random() - 0.2 },
          colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffd166', '#06d6a0']
        });
        confetti({
          startVelocity: 35,
          spread: 360,
          ticks: 60,
          origin: { x: Math.random() * 0.4 + 0.5, y: Math.random() - 0.2 },
          colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffd166', '#06d6a0']
        });
      }, 250);
    }

    // Aksi klik YES
    btnYes.addEventListener('click', () => {
      mainCard.classList.add('fade-out');
      luncurkanMercon();

      setTimeout(() => {
        mainCard.style.display = 'none';
        resultView.style.display = 'flex';
      }, 350);
    });
  </script>
</body>
</html>
